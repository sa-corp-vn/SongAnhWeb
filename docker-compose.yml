# Chạy website trên máy chủ:  docker compose up -d --build
# Dữ liệu nằm ngoài container (thư mục ./data và ./media) — sao lưu 2 thư mục này là đủ.
services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./media:/app/media
